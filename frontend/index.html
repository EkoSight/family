<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f8cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Ekosight CEO Agent</title>
<style>
  :root{
    --bg:#f5f7fb; --surface:#ffffff; --surface2:#f0f3f8; --line:#e3e8f0;
    --text:#141a24; --muted:#63708a; --accent:#3d6fff; --accent-soft:#e8eeff;
    --green:#0f9d58; --amber:#e0920b; --red:#e5484d; --chip:#eef1f7;
    --shadow:0 1px 2px rgba(20,26,36,.06),0 8px 24px rgba(20,26,36,.06);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --surface:#161b22; --surface2:#1c2230; --line:#262d3a;
      --text:#e8edf4; --muted:#8b97a9; --accent:#5b8cff; --accent-soft:#1b2740;
      --green:#3fb950; --amber:#d29922; --red:#f85149; --chip:#222a37;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  .muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}
  h1,h2,h3{margin:0}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);
    background:var(--surface2);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  a{color:var(--accent)}

  /* ---- Login ---- */
  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:30px;max-width:400px;width:100%}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .chip-btn{background:var(--chip);border:1px solid var(--line);border-radius:20px;
    padding:7px 13px;font-size:13px;color:var(--text)}
  .chip-btn:hover{border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;
    padding:12px 16px;font-size:15px;font-weight:600;width:100%}
  .btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
  .btn.ok{background:var(--green)} .btn.danger{background:var(--red)}
  .btn.slim{width:auto;padding:8px 14px;font-size:13.5px}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}

  /* ---- App shell ---- */
  #app{display:none;min-height:100%}
  .layout{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  aside{background:var(--surface);border-right:1px solid var(--line);
    padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
  aside .brand{padding:6px 8px 14px}
  .navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
    color:var(--muted);border:none;background:none;width:100%;text-align:left;font-size:14.5px}
  .navlink .ic{width:20px;text-align:center;font-size:17px}
  .navlink.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .navlink:hover{color:var(--text)}
  .navlink .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;
    font-size:11px;padding:1px 7px;font-weight:700}
  .userbox{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;
    display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  main{padding:22px;max-width:1000px;width:100%;margin:0 auto}
  .topbar{display:none}

  /* ---- Cards & components ---- */
  .screen{display:none;animation:fade .2s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .pagehead h2{font-size:20px;font-weight:700}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .n{font-size:30px;font-weight:800;letter-spacing:-1px}
  .kpi .l{color:var(--muted);font-size:12.5px;margin-top:3px}
  .kpi.a .n{color:var(--accent)} .kpi.w .n{color:var(--amber)} .kpi.r .n{color:var(--red)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
    font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .grow{flex:1;min-width:0}
  .row .grow .t{font-weight:500}
  .pill{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--chip);
    color:var(--muted);white-space:nowrap;font-weight:600}
  .pill.high,.pill.red,.pill.overdue{background:rgba(229,72,77,.13);color:var(--red)}
  .pill.green,.pill.done{background:rgba(15,157,88,.14);color:var(--green)}
  .pill.amber,.pill.medium{background:rgba(224,146,11,.15);color:var(--amber)}
  .pill.blue{background:var(--accent-soft);color:var(--accent)}
  .empty{color:var(--muted);padding:22px;text-align:center;font-size:14px}
  .bar{height:7px;background:var(--surface2);border-radius:6px;overflow:hidden;min-width:70px}
  .bar>span{display:block;height:100%;background:var(--accent)}
  table{width:100%;border-collapse:collapse}
  .tablewrap{overflow-x:auto}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);font-size:13.5px;white-space:nowrap}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:12.5px}

  /* ---- Chat ---- */
  .chatwrap{display:flex;flex-direction:column;height:calc(100vh - 150px)}
  .stream{flex:1;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:4px}
  .msg{margin:6px 0;max-width:86%}
  .msg.me{align-self:flex-end}
  .msg .bubble{display:inline-block;padding:11px 15px;border-radius:16px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
  .msg.me .bubble{background:var(--accent);border-color:var(--accent);color:#fff}
  .composer{display:flex;gap:9px;padding-top:12px;border-top:1px solid var(--line);align-items:center}
  .composer input{flex:1;border-radius:22px;padding:12px 16px}
  .mic{width:46px;height:46px;flex:none;border-radius:50%;border:1px solid var(--line);
    background:var(--surface2);color:var(--text);font-size:19px;display:grid;place-items:center}
  .mic.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .sendb{width:46px;height:46px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
    border:none;font-size:18px}
  .interp{background:var(--surface2);border:1px solid var(--line);border-radius:13px;
    padding:11px 13px;margin-top:8px}
  .interp .item{padding:7px 0;border-bottom:1px solid var(--line)}
  .interp .item:last-child{border-bottom:none}

  /* ---- FAB ---- */
  .fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:18px;
    background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:var(--shadow);z-index:30}

  /* ---- Modal ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(8,12,20,.55);display:flex;
    align-items:flex-end;justify-content:center;z-index:40;padding:0}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;
    width:100%;max-width:520px;padding:22px;max-height:92vh;overflow-y:auto}
  .modal h3{font-size:18px;margin-bottom:14px}
  .field{margin-bottom:12px} .field label{display:block;font-size:12.5px;color:var(--muted);
    margin-bottom:5px;font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* ---- Bottom nav (mobile) ---- */
  .botnav{display:none}

  /* ---- Responsive ---- */
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    aside{display:none}
    .topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;
      background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
      padding-top:max(12px,env(safe-area-inset-top))}
    .topbar .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;
      display:grid;place-items:center;font-weight:800}
    main{padding:16px 14px 90px}
    .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
      border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
    .botnav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 2px 8px;
      display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;position:relative}
    .botnav button.active{color:var(--accent)}
    .botnav .ic{font-size:20px}
    .botnav .badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--red);color:#fff;
      border-radius:9px;font-size:9px;padding:0 5px;font-weight:700}
    .fab{bottom:78px}
    .modal{border-radius:22px 22px 0 0}
    .two{grid-template-columns:1fr}
    .chatwrap{height:calc(100vh - 210px)}
    .kpis{grid-template-columns:repeat(2,1fr)}
  }
  @media (min-width:821px){
    .modal-bg{align-items:center}
    .modal{border-radius:22px}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="brand"><div class="logo">E</div>
      <div><h1 style="font-size:18px">Ekosight CEO Agent</h1>
      <div class="muted small">Your company operating agent</div></div></div>
    <p class="muted small" style="margin:14px 0 4px">Sign in with your work email.</p>
    <input id="loginEmail" type="email" placeholder="you@ekosight.com" autocomplete="email">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn">Continue</button>
    <div class="muted tiny" style="margin:16px 0 4px">Quick sign-in (demo):</div>
    <div class="chips" id="loginChips"></div>
    <div class="muted tiny">Production uses Google Workspace login. This MVP identifies you by email.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="layout">
    <aside>
      <div class="brand"><div class="logo">E</div>
        <div><div style="font-weight:700;font-size:15px">CEO Agent</div>
        <div class="muted tiny">Ekosight</div></div></div>
      <div id="sideNav"></div>
      <div class="userbox">
        <div class="avatar" id="uAvatar">?</div>
        <div class="grow" style="flex:1;min-width:0">
          <div class="small" id="uName" style="font-weight:600"></div>
          <div class="muted tiny" id="uRole"></div>
        </div>
        <button class="navlink" style="width:auto;padding:8px" title="Sign out" onclick="logout()">⏻</button>
      </div>
    </aside>

    <div>
      <div class="topbar">
        <div class="logo">E</div>
        <div style="font-weight:700">CEO Agent</div>
        <div class="muted small" id="topTitle" style="margin-left:auto"></div>
      </div>
      <main>
        <section id="today" class="screen"></section>
        <section id="chat" class="screen"></section>
        <section id="mywork" class="screen"></section>
        <section id="people" class="screen"></section>
        <section id="company" class="screen"></section>
        <section id="team" class="screen"></section>
        <section id="memory" class="screen"></section>
        <section id="processes" class="screen"></section>
        <section id="activity" class="screen"></section>
      </main>
    </div>
  </div>

  <button class="fab hidden" id="fab" title="New task" onclick="openTaskModal()">＋</button>
  <div class="botnav" id="botNav"></div>
</div>

<div id="modalRoot"></div>

<script>
/* ================= state ================= */
const store = {
  get user(){ try{return JSON.parse(localStorage.getItem('ceoUser'))}catch(e){return null} },
  set user(u){ u?localStorage.setItem('ceoUser',JSON.stringify(u)):localStorage.removeItem('ceoUser'); }
};
let CURRENT = null;      // current user object
let COUNTS = {};         // dashboard counts (for badges)

const ICON = {today:'🌅',chat:'💬',mywork:'✅',people:'👥',company:'🏢',team:'📊',
  memory:'🧠',processes:'🔁',activity:'📜'};
const LABEL = {today:'Today',chat:'Chat',mywork:'My Work',people:'People',company:'Company',
  team:'Team',memory:'Memory',processes:'Processes',activity:'Activity'};
// nav per role
const NAV_CEO = ['today','chat','people','company','team','memory','processes','activity'];
const NAV_MEMBER = ['mywork','chat','team'];
const BOTTOM_CEO = ['today','chat','company','team','people'];
const BOTTOM_MEMBER = ['mywork','chat','team'];

/* ================= helpers ================= */
function esc(s){return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;}
function initials(n){return (n||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();}
function todayStr(){return new Date().toISOString().slice(0,10);}
async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m);}
  const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text();
}

/* ================= login ================= */
async function bootLogin(){
  try{
    const people=await api('/api/people');
    const chips=document.getElementById('loginChips');
    chips.innerHTML='';
    people.filter(p=>p.email).forEach(p=>{
      const b=el(`<button class="chip-btn">${esc(p.name)}</button>`);
      b.onclick=()=>doLogin(p.email);
      chips.appendChild(b);
    });
  }catch(e){/* server maybe still starting */}
}
async function doLogin(email){
  const err=document.getElementById('loginErr');err.textContent='';
  try{
    const u=await api('/api/login',{method:'POST',body:JSON.stringify({email})});
    store.user=u;CURRENT=u;enterApp();
  }catch(e){err.textContent=e.message;}
}
document.getElementById('loginBtn').onclick=()=>{
  const v=document.getElementById('loginEmail').value.trim();
  if(v)doLogin(v);
};
document.getElementById('loginEmail').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click();});
function logout(){store.user=null;location.reload();}

/* ================= shell ================= */
function isCEO(){return CURRENT && (CURRENT.permission_level==='ceo'||CURRENT.permission_level==='manager');}
function navFor(){return isCEO()?NAV_CEO:NAV_MEMBER;}
function bottomFor(){return isCEO()?BOTTOM_CEO:BOTTOM_MEMBER;}

function buildNav(){
  const side=document.getElementById('sideNav');side.innerHTML='';
  navFor().forEach(id=>{
    const b=el(`<button class="navlink" data-id="${id}"><span class="ic">${ICON[id]}</span>${LABEL[id]}<span class="badge hidden" data-badge="${id}"></span></button>`);
    b.onclick=()=>go(id);side.appendChild(b);
  });
  const bot=document.getElementById('botNav');bot.innerHTML='';
  bottomFor().forEach(id=>{
    const b=el(`<button data-id="${id}"><span class="ic">${ICON[id]}</span>${LABEL[id]}<span class="badge hidden" data-badge2="${id}"></span></button>`);
    b.onclick=()=>go(id);bot.appendChild(b);
  });
}
let CURRENT_SCREEN=null;
function go(id){
  CURRENT_SCREEN=id;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('.navlink').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  document.querySelectorAll('.botnav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  document.getElementById('topTitle').textContent=LABEL[id];
  document.getElementById('fab').classList.toggle('hidden', !(isCEO() && ['today','company','people'].includes(id)));
  RENDER[id]();
}
function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('uName').textContent=CURRENT.name;
  document.getElementById('uRole').textContent=CURRENT.designation||CURRENT.permission_level;
  document.getElementById('uAvatar').textContent=initials(CURRENT.name);
  buildNav();
  refreshBadges();
  go(navFor()[0]);
}
async function refreshBadges(){
  try{
    COUNTS=await api('/api/counts');
    const n=COUNTS.needs_attention||0;
    document.querySelectorAll('[data-badge="today"],[data-badge2="today"]').forEach(b=>{
      if(n>0){b.textContent=n;b.classList.remove('hidden');}else b.classList.add('hidden');
    });
  }catch(e){}
}

/* ================= renderers ================= */
const taskRow=(t,actions='')=>`
  <div class="row"><div class="grow"><div class="t">${esc(t.title)}</div>
    <div class="muted tiny">${esc(t.assigned_to||'Unassigned')}${t.project?' · '+esc(t.project):''}${t.blocked?' · <span style="color:var(--red)">⚠ '+esc(t.blocker_reason||'blocked')+'</span>':''}</div>
    ${actions}</div>
    ${t.deadline?`<span class="pill ${t.deadline<todayStr()&&t.status!=='done'?'overdue':''}">${t.deadline}</span>`:''}
    <span class="pill ${t.priority}">${t.priority}</span></div>`;

/* -- Today (CEO) -- */
async function renderToday(){
  const s=document.getElementById('today');s.innerHTML='<div class="empty">Loading…</div>';
  const d=await api('/api/briefing/morning');const c=d.counts;
  const kpi=(cls,n,l)=>`<div class="kpi ${cls}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  s.innerHTML=`
    <div class="pagehead"><h2>${esc(d.greeting)}</h2><span class="muted small">${d.date}</span>
      <button class="btn slim" style="margin-left:auto" onclick="loadBriefing('evening')">Evening review</button></div>
    <div class="grid kpis" style="margin-bottom:16px">
      ${kpi('a',c.needs_attention,'Needs Attention')}${kpi('w',c.needs_approval,'Needs Approval')}
      ${kpi('r',c.overdue,'Overdue')}${kpi('r',c.blocked,'Blocked')}
      ${kpi('',c.waiting_for_others,'Waiting on Others')}${kpi('',c.upcoming_meetings,'Meetings')}
      ${kpi('',c.processes_detected,'Processes')}</div>
    <div class="card"><h3>🔥 Today's priorities</h3>${d.todays_priorities.map(t=>taskRow(t)).join('')||'<div class="empty">All clear.</div>'}</div>
    <div class="card"><h3>🤝 Your commitments</h3>${d.your_commitments.map(x=>`<div class="row"><div class="grow"><div class="t">${esc(x.text)}</div><div class="muted tiny">to ${esc(x.made_to||'—')}</div></div>${x.deadline?`<span class="pill">${x.deadline}</span>`:''}</div>`).join('')||'<div class="empty">None.</div>'}</div>
    <div class="card"><h3>⏳ Waiting for others</h3>${d.waiting_for_others.map(t=>taskRow(t)).join('')||'<div class="empty">None.</div>'}</div>
    <div class="card"><h3>📈 Project health</h3>${d.major_project_health.map(p=>`<div class="row"><div class="grow"><div class="t">${esc(p.name)}</div><div class="bar" style="margin-top:6px"><span style="width:${p.progress}%"></span></div></div><span class="pill ${p.health==='green'?'green':p.health==='red'?'red':'amber'}">${p.health}</span></div>`).join('')||'<div class="empty">None.</div>'}</div>
    <div class="card"><h3>💡 Recommendations</h3>${d.recommendations.map(r=>`<div class="row"><div class="grow">${esc(r)}</div></div>`).join('')}</div>`;
}
async function loadBriefing(kind){
  const d=await api('/api/briefing/'+kind);
  const body=(kind==='evening')?`
    <div class="card"><h3>✅ Completed today</h3>${(d.completed_today||[]).map(t=>taskRow(t)).join('')||'<div class="empty">Nothing marked done yet.</div>'}</div>
    <div class="card"><h3>🕗 Still open (due)</h3>${(d.still_open||[]).map(t=>taskRow(t)).join('')||'<div class="empty">Clear.</div>'}</div>
    <div class="card"><h3>💡 Recommendations</h3>${d.recommendations.map(r=>`<div class="row"><div class="grow">${esc(r)}</div></div>`).join('')}</div>`:'';
  openModal(`<h3>${esc(d.greeting)}</h3><div class="muted small" style="margin-bottom:10px">${d.date}</div>${body}<button class="btn sec" onclick="closeModal()">Close</button>`);

/* -- Chat -- */
let chatEls=[];
function renderChat(){
  const s=document.getElementById('chat');
  s.innerHTML=`<div class="chatwrap"><div class="stream" id="stream"></div>
    <div class="composer"><button class="mic" id="mic" title="Hold to talk">🎙️</button>
      <input id="msg" placeholder="Message your agent…" autocomplete="off">
      <button class="sendb" id="send">➤</button></div></div>`;
  const stream=s.querySelector('#stream');
  if(!chatEls.length)stream.appendChild(el(`<div class="empty">Speak or type naturally — I turn it into tasks, decisions, commitments and approvals.</div>`));
  chatEls.forEach(m=>stream.appendChild(m));
  const input=s.querySelector('#msg');
  s.querySelector('#send').onclick=()=>sendMsg(input);
  input.onkeydown=e=>{if(e.key==='Enter')sendMsg(input);};
  setupMic(s.querySelector('#mic'),input);
  stream.scrollTop=stream.scrollHeight;
}
async function sendMsg(input){
  const text=input.value.trim();if(!text)return;input.value='';
  const stream=document.getElementById('stream');
  if(stream.querySelector('.empty'))stream.innerHTML='';
  const mine=el(`<div class="msg me"><div class="bubble">${esc(text)}</div></div>`);
  chatEls.push(mine);stream.appendChild(mine);stream.scrollTop=stream.scrollHeight;
  try{
    const res=await api('/api/chat',{method:'POST',body:JSON.stringify({message:text,speaker:CURRENT.name})});
    const card=renderInterp(res);chatEls.push(card);stream.appendChild(card);
  }catch(e){const er=el(`<div class="msg"><div class="bubble">⚠ ${esc(e.message)}</div></div>`);stream.appendChild(er);}
  stream.scrollTop=stream.scrollHeight;refreshBadges();
}
function renderInterp(res){
  const items=res.interpretation.map(i=>`<div class="item">• ${esc(i.summary)} <span class="muted tiny">(${esc(i.tool)})</span></div>`).join('');
  const exec=res.executed.map(e=>`<div class="item">✅ ${esc(e.summary)}</div>`).join('');
  const wait=res.awaiting_approval.map(a=>`<div class="item" id="w_${a.action_id}">⏳ ${esc(a.summary)} <span class="pill amber">${esc(a.risk||'approval')}</span>
     <div class="btnrow"><button class="btn slim ok" onclick="approveAction('${a.action_id}')">Approve</button>
       <button class="btn slim danger" onclick="rejectAction('${a.action_id}')">Reject</button></div></div>`).join('');
  return el(`<div class="msg"><div class="bubble" style="max-width:560px"><b>I identified</b>
    <div class="interp">${items||'<div class="item muted">Nothing actionable.</div>'}
    ${exec?`<div style="margin-top:6px">${exec}</div>`:''}${wait?`<div style="margin-top:6px">${wait}</div>`:''}</div></div></div>`);
}
async function approveAction(id){await api('/api/actions/'+id+'/approve',{method:'POST'});document.getElementById('w_'+id).innerHTML='<span class="pill green">✅ Approved & executed</span>';refreshBadges();}
async function rejectAction(id){await api('/api/actions/'+id+'/reject',{method:'POST'});document.getElementById('w_'+id).innerHTML='<span class="pill red">Rejected</span>';refreshBadges();}
function setupMic(mic,input){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){mic.onclick=()=>{const t=prompt('Voice note — speak or paste the transcript:');if(t)input.value=t;};return;}
  const rec=new SR();rec.lang='en-IN';rec.interimResults=false;let on=false;
  mic.onclick=()=>{on?rec.stop():rec.start();};
  rec.onstart=()=>{on=true;mic.classList.add('rec');};
  rec.onend=()=>{on=false;mic.classList.remove('rec');};
  rec.onresult=e=>{input.value=e.results[0][0].transcript;input.focus();};
}

/* -- My Work (member) -- */
async function renderMyWork(){
  const s=document.getElementById('mywork');s.innerHTML='<div class="empty">Loading…</div>';
  const tasks=await api('/api/my/tasks?person='+encodeURIComponent(CURRENT.person_id));
  const open=tasks.filter(t=>t.status!=='done');const done=tasks.filter(t=>t.status==='done');
  const actions=t=>{
    let a='<div class="btnrow">';
    if(t.acceptance_status==='pending')a+=`<button class="btn slim ok" onclick="taskAction('${t.task_id}','accept')">Accept</button><button class="btn slim sec" onclick="taskAction('${t.task_id}','decline')">Decline</button>`;
    if(t.acceptance_status==='accepted'&&t.status!=='submitted'){
      a+=`<button class="btn slim sec" onclick="promptProgress('${t.task_id}')">Update %</button>`;
      a+=t.blocked?`<button class="btn slim sec" onclick="taskAction('${t.task_id}','unblock')">Unblock</button>`:`<button class="btn slim sec" onclick="promptBlocker('${t.task_id}')">Report blocker</button>`;
      a+=`<button class="btn slim" onclick="taskAction('${t.task_id}','complete')">Mark done</button>`;
    }
    if(t.status==='submitted')a+='<span class="pill amber">Submitted — awaiting approval</span>';
    return a+'</div>';
  };
  s.innerHTML=`<div class="pagehead"><h2>My Work</h2><span class="pill blue">${open.length} open</span></div>
    <div class="card"><h3>Assigned to me</h3>${open.map(t=>`<div class="row"><div class="grow"><div class="t">${esc(t.title)}</div>
      <div class="muted tiny">${t.project?esc(t.project)+' · ':''}${t.progress}% ${t.blocked?'· <span style="color:var(--red)">⚠ '+esc(t.blocker_reason||'blocked')+'</span>':''}</div>
      <div class="bar" style="margin-top:6px"><span style="width:${t.progress}%"></span></div>${actions(t)}</div>
      ${t.deadline?`<span class="pill ${t.deadline<todayStr()?'overdue':''}">${t.deadline}</span>`:''}</div>`).join('')||'<div class="empty">No open tasks. 🎉</div>'}</div>
    ${done.length?`<div class="card"><h3>Recently done</h3>${done.map(t=>taskRow(t)).join('')}</div>`:''}`;
}
async function taskAction(id,action){await api(`/api/tasks/${id}/${action}`,{method:'POST',body:JSON.stringify({actor:CURRENT.name})});RENDER[CURRENT_SCREEN]();refreshBadges();}
function promptProgress(id){const v=prompt('Progress % (0-100):');if(v!==null)api(`/api/tasks/${id}/progress`,{method:'POST',body:JSON.stringify({progress:parseInt(v)||0,actor:CURRENT.name})}).then(()=>RENDER[CURRENT_SCREEN]());}
function promptBlocker(id){const v=prompt('What is blocking this?');if(v)api(`/api/tasks/${id}/blocker`,{method:'POST',body:JSON.stringify({reason:v,actor:CURRENT.name})}).then(()=>{RENDER[CURRENT_SCREEN]();refreshBadges();});}

async function renderMemory(){
  const s=document.getElementById('memory');s.innerHTML='<div class="empty">Loading…</div>';

  s.innerHTML=`<div class="pagehead"><h2>Memory</h2></div>

/* ================= modals ================= */
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

async function openTaskModal(){
  const people=await api('/api/people');const projects=await api('/api/projects');
  const opts=people.filter(p=>p.active).map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  const projOpts='<option value="">— none —</option>'+projects.map(p=>`<option>${esc(p.project_name)}</option>`).join('');
  openModal(`<h3>New task</h3>
    <div class="field"><label>Title</label><input id="tk_title" placeholder="e.g. Complete GeM checklist"></div>
    <div class="two"><div class="field"><label>Assign to</label><select id="tk_who">${opts}</select></div>
      <div class="field"><label>Project</label><select id="tk_proj">${projOpts}</select></div></div>
    <div class="two"><div class="field"><label>Deadline</label><input id="tk_dl" type="date"></div>
      <div class="field"><label>Priority</label><select id="tk_prio"><option>medium</option><option>high</option><option>low</option></select></div></div>
    <div class="field"><label><input type="checkbox" id="tk_appr" style="width:auto;margin-right:6px">Requires my approval before done</label></div>
    <div class="err" id="tk_err"></div>
    <div class="btnrow"><button class="btn" onclick="saveTask()">Create task</button><button class="btn sec slim" onclick="closeModal()">Cancel</button></div>`);
}
async function saveTask(){
  const title=document.getElementById('tk_title').value.trim();
  if(!title){document.getElementById('tk_err').textContent='Title is required';return;}
  await api('/api/tasks',{method:'POST',body:JSON.stringify({
    title,assigned_to:document.getElementById('tk_who').value,assigned_by:CURRENT.name,
    project:document.getElementById('tk_proj').value||null,deadline:document.getElementById('tk_dl').value||null,
    priority:document.getElementById('tk_prio').value,approval_required:document.getElementById('tk_appr').checked})});
  closeModal();if(RENDER[CURRENT_SCREEN])RENDER[CURRENT_SCREEN]();refreshBadges();
}
async function openPersonModal(p){
  const people=await api('/api/people');
  const mgrOpts='<option value="">— none —</option>'+people.map(x=>`<option ${p&&p.manager===x.name?'selected':''}>${esc(x.name)}</option>`).join('');
  const edit=!!p;p=p||{};
  openModal(`<h3>${edit?'Edit':'Add'} person</h3>
    <div class="field"><label>Name</label><input id="p_name" value="${esc(p.name||'')}"></div>
    <div class="two"><div class="field"><label>Email</label><input id="p_email" value="${esc(p.email||'')}"></div>
      <div class="field"><label>Designation</label><input id="p_desig" value="${esc(p.designation||'')}"></div></div>
    <div class="two"><div class="field"><label>Department</label><input id="p_dept" value="${esc(p.department||'')}"></div>
      <div class="field"><label>Manager</label><select id="p_mgr">${mgrOpts}</select></div></div>
    <div class="field"><label>Access level</label><select id="p_perm">
      <option value="member" ${p.permission_level==='member'?'selected':''}>member</option>
      <option value="manager" ${p.permission_level==='manager'?'selected':''}>manager</option>
      <option value="ceo" ${p.permission_level==='ceo'?'selected':''}>ceo</option></select></div>
    <div class="err" id="p_err"></div>
    <div class="btnrow"><button class="btn" onclick="savePerson('${edit?p.person_id:''}')">${edit?'Save':'Add person'}</button>
      <button class="btn sec slim" onclick="closeModal()">Cancel</button></div>`);
}
async function savePerson(id){
  const name=document.getElementById('p_name').value.trim();
  if(!name){document.getElementById('p_err').textContent='Name is required';return;}
  const body={name,email:document.getElementById('p_email').value.trim()||null,
    designation:document.getElementById('p_desig').value.trim()||null,
    department:document.getElementById('p_dept').value.trim()||null,
    manager:document.getElementById('p_mgr').value||null,
    permission_level:document.getElementById('p_perm').value};
  if(id)await api('/api/people/'+id,{method:'PATCH',body:JSON.stringify(body)});
  else await api('/api/people',{method:'POST',body:JSON.stringify(body)});
  closeModal();renderPeople();
}

bootLogin();
